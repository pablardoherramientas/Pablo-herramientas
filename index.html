<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servi-Copy Herramientas</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sc-bg:#0f0f0f;
  --sc-surface:#1a1a1a;
  --sc-card:#222;
  --sc-border:#333;
  --sc-red:#cc1c1c;
  --sc-red-dark:#991414;
  --sc-red-light:#e63030;
  --sc-text:#f0f0f0;
  --sc-muted:#888;
  --sc-success:#2ecc71;
  --sc-warning:#f39c12;
  --sc-danger:#e74c3c;
  --sc-info:#3498db;
  --radius:10px;
  --radius-sm:6px;
}
body{background:var(--sc-bg);color:var(--sc-text);font-family:system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}

.topbar{background:var(--sc-surface);border-bottom:2px solid var(--sc-red);display:flex;align-items:center;gap:12px;padding:0 14px;height:54px;position:relative;z-index:10;}
.hamburger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:6px;flex-shrink:0;}
.hamburger span{display:block;width:22px;height:2px;background:var(--sc-text);border-radius:2px;transition:all 0.25s;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.logo-area{display:flex;align-items:center;gap:10px;flex:1;}
.logo-circle{width:38px;height:38px;border-radius:50%;background:#000;border:2px solid var(--sc-red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-inner{text-align:center;line-height:1;font-size:13px;font-weight:700;color:var(--sc-red);font-style:italic;}
.topbar-title{font-size:15px;font-weight:500;color:var(--sc-text);}
.topbar-date{font-size:11px;color:var(--sc-muted);margin-left:auto;white-space:nowrap;}

.overlay{display:none;position:absolute;top:54px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:5;}
.overlay.show{display:block;}
.drawer{position:absolute;top:54px;left:0;bottom:0;width:240px;background:var(--sc-surface);border-right:1px solid var(--sc-border);z-index:6;transform:translateX(-100%);transition:transform 0.25s ease;display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:18px 16px 12px;border-bottom:1px solid var(--sc-border);}
.dh-name{font-size:16px;font-weight:500;}
.dh-sub{font-size:12px;color:var(--sc-muted);margin-top:2px;}
.drawer-nav{padding:8px 0;flex:1;}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;border:none;background:none;color:var(--sc-muted);font-size:14px;width:100%;text-align:left;border-left:3px solid transparent;transition:all 0.15s;}
.nav-item:hover{background:rgba(204,28,28,0.08);color:var(--sc-text);}
.nav-item.active{color:var(--sc-text);background:rgba(204,28,28,0.12);border-left-color:var(--sc-red);}
.nav-icon{width:16px;height:16px;}

.page{display:none;padding:14px;min-height:400px;}
.page.active{display:block;}

.section{background:var(--sc-card);border-radius:var(--radius);border:0.5px solid var(--sc-border);padding:14px;margin-bottom:12px;}
.stitle{font-size:11px;font-weight:500;color:var(--sc-muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px;}
.ssub{font-size:12px;color:var(--sc-muted);margin-top:-8px;margin-bottom:12px;}

.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:12px;color:var(--sc-muted);margin-bottom:5px;}
.form-group input{width:100%;padding:9px 11px;border:0.5px solid var(--sc-border);border-radius:var(--radius-sm);background:var(--sc-bg);color:var(--sc-text);font-size:14px;}

.btn{padding:9px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--sc-border);background:var(--sc-surface);color:var(--sc-text);font-size:13px;cursor:pointer;transition:all 0.15s;width:100%;}
.btn.primary{background:var(--sc-red);border-color:var(--sc-red-dark);color:#fff;}
.btn.sm{padding:5px 10px;font-size:12px;width:auto;}

.drive-status{font-size:11px;color:var(--sc-muted);margin-top:6px;min-height:16px;text-align:center;}
.drive-status.ok{color:var(--sc-success);}
.drive-status.err{color:var(--sc-danger);}
.alert{padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:10px;}
.alert.ok{background:#0d2b1a;color:var(--sc-success);border:0.5px solid #1a5c35;}
</style>
</head>
<body>

<div class="topbar">
  <button class="hamburger" id="hamburger" onclick="toggleDrawer()">
    <span></span><span></span><span></span>
  </button>
  <div class="logo-area">
    <div class="logo-circle"><div class="logo-inner">PV</div></div>
    <span class="topbar-title" id="topbarTitle">Caja</span>
  </div>
  <span class="topbar-date" id="topbarDate"></span>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="dh-name">Pablo Vallejos</div>
    <div class="dh-sub">Herramientas Servi-Copy</div>
  </div>
  <div class="drawer-nav">
    <button class="nav-item active" onclick="navTo('caja',this)">Caja</button>
    <button class="nav-item" onclick="navTo('limpiador',this)">Limpiador de Dirs.</button>
    <button class="nav-item" onclick="navTo('geocodificador',this)">Geocodificador</button>
    <div style="border-top:0.5px solid var(--sc-border);margin-top:6px;padding-top:6px;"></div>
    <button class="nav-item" onclick="navTo('config',this)">Configuración</button>
  </div>
  <div style="padding:14px 16px; border-top:1px solid var(--sc-border);">
    <div style="display:flex;gap:6px;">
      <button class="btn sm primary" onclick="driveSync()" style="flex:1;">☁ Guardar</button>
      <button class="btn sm" onclick="driveLoad()" style="flex:1;">↓ Cargar</button>
    </div>
    <div class="drive-status" id="driveStatus">Listo</div>
  </div>
</div>

<div class="page active" id="page-caja">
    <div class="section">
        <div class="stitle">Sistema de Caja Local</div>
        <p style="font-size:13px; color:var(--sc-muted)">Usa el menú lateral para sincronizar con Google Drive.</p>
    </div>
</div>

<div class="page" id="page-config">
  <div class="section">
    <div class="stitle">Credenciales de Google Drive</div>
    <div class="ssub">Guardadas localmente en este navegador.</div>
    <div class="form-group">
      <label>Google API Key</label>
      <input type="password" id="cfgDriveKey" placeholder="AIzaSy...">
    </div>
    <div class="form-group">
      <label>Google Client ID</label>
      <input type="password" id="cfgClientId" placeholder="apps.googleusercontent.com">
    </div>
  </div>
  <div class="section" style="border-color:var(--sc-red-dark);">
    <div class="stitle">Claude AI (Anthropic)</div>
    <div class="form-group">
      <label>Claude API Key</label>
      <input type="password" id="cfgClaudeKey" placeholder="sk-ant-...">
    </div>
  </div>
  <button class="btn primary" onclick="saveSettings()">Guardar y Reiniciar</button>
  <div id="cfgAlert" style="margin-top:10px; display:none;"></div>
</div>

<div class="page" id="page-limpiador" style="padding:0;height:calc(100vh - 54px);">
  <iframe id="iframeLimpiador" srcdoc="<html><body><script>window.addEventListener('message', (e) => { if(e.data.type==='SET_KEY') window.CLAUDE_KEY = e.data.key; });</script><p style='color:white; padding:20px'>Cargando Limpiador...</p></body></html>" style="width:100%;height:100%;border:none;"></iframe>
</div>

<div class="page" id="page-geocodificador" style="padding:0;height:calc(100vh - 54px);">
  <iframe id="iframeGeocodificador" srcdoc="<html><body><script>window.addEventListener('message', (e) => { if(e.data.type==='SET_KEY') window.CLAUDE_KEY = e.data.key; });</script><p style='color:white; padding:20px'>Cargando Geocodificador...</p></body></html>" style="width:100%;height:100%;border:none;"></iframe>
</div>

<script>
let DRIVE_API_KEY    = localStorage.getItem('sc_drive_key') || '';
let DRIVE_CLIENT_ID  = localStorage.getItem('sc_client_id') || '';
let CLAUDE_API_KEY   = localStorage.getItem('sc_claude_key') || '';

function saveSettings() {
  localStorage.setItem('sc_drive_key', document.getElementById('cfgDriveKey').value.trim());
  localStorage.setItem('sc_client_id', document.getElementById('cfgClientId').value.trim());
  localStorage.setItem('sc_claude_key', document.getElementById('cfgClaudeKey').value.trim());
  location.reload();
}

function navTo(page, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  
  if(page === 'config') {
      document.getElementById('cfgDriveKey').value = DRIVE_API_KEY;
      document.getElementById('cfgClientId').value = DRIVE_CLIENT_ID;
      document.getElementById('cfgClaudeKey').value = CLAUDE_API_KEY;
  }
  
  if(page === 'limpiador' || page === 'geocodificador') {
      const frame = document.querySelector(`#page-${page} iframe`);
      frame.contentWindow.postMessage({ type: 'SET_KEY', key: CLAUDE_API_KEY }, '*');
  }
  closeDrawer();
}

function toggleDrawer(){ document.getElementById('drawer').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

// --- INTEGRACIÓN DRIVE ---
let driveTokenClient = null;
let driveAccessToken = null;

function driveInit(){
  if(!DRIVE_API_KEY || !DRIVE_CLIENT_ID) return;
  gapi.load('client', async ()=>{
    await gapi.client.init({ apiKey: DRIVE_API_KEY, discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp)=>{ driveAccessToken = resp.access_token; gapi.client.setToken({access_token: driveAccessToken}); if(window.pendingAction) window.pendingAction(); }
    });
  });
}

function driveSync(){
    if(!driveAccessToken) { window.pendingAction = driveSync; driveTokenClient.requestAccessToken(); return; }
    // Lógica de subida aquí...
    document.getElementById('driveStatus').textContent = "Sincronizando...";
}

window.onload = () => { driveInit(); };
</script>
</body>
</html>
